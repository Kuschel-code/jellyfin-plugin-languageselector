name: Release Plugin

# One-click build & publish. Trigger this workflow manually (Actions tab ->
# "Release Plugin" -> "Run workflow"), optionally giving a new version and a
# changelog. It builds the DLL, packages the zip, computes the MD5 checksum,
# writes a matching entry into manifest.json, commits & pushes that change, and
# creates a GitHub release with the zip attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version (4 parts, e.g. 1.0.4.0). Leave empty to reuse the version already in the csproj.'
        required: false
        default: ''
      changelog:
        description: 'Changelog text for this release.'
        required: false
        default: 'Maintenance release.'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CSPROJ: Jellyfin.Plugin.LanguageSelector/Jellyfin.Plugin.LanguageSelector.csproj
      TARGET_ABI: 10.10.0.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        run: |
          INPUT="${{ github.event.inputs.version }}"
          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"
            sed -i -E "s#<AssemblyVersion>[^<]+</AssemblyVersion>#<AssemblyVersion>${VERSION}</AssemblyVersion>#" "$CSPROJ"
            sed -i -E "s#<FileVersion>[^<]+</FileVersion>#<FileVersion>${VERSION}</FileVersion>#" "$CSPROJ"
          else
            VERSION=$(grep -oPm1 '(?<=<AssemblyVersion>)[^<]+' "$CSPROJ")
          fi
          TAG="v$(echo "$VERSION" | cut -d. -f1-3)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION as tag $TAG"

      - name: Build (Release)
        run: dotnet build "$CSPROJ" -c Release

      - name: Package and checksum
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="jellyfin-plugin-languageselector_${VERSION}.zip"
          DLL_DIR="Jellyfin.Plugin.LanguageSelector/bin/Release/net8.0"
          mkdir -p dist
          (cd "$DLL_DIR" && zip -j "$GITHUB_WORKSPACE/dist/$ZIP" "Jellyfin.Plugin.LanguageSelector.dll")
          CHECKSUM=$(md5sum "dist/$ZIP" | awk '{print $1}')
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Update manifest.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          CHECKSUM="${{ steps.package.outputs.checksum }}"
          ZIP="${{ steps.package.outputs.zip }}"
          REPO="${{ github.repository }}"
          SOURCEURL="https://github.com/${REPO}/releases/download/${TAG}/${ZIP}"
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CHANGELOG="${{ github.event.inputs.changelog }}"

          ENTRY=$(jq -n \
            --arg version "$VERSION" \
            --arg changelog "$CHANGELOG" \
            --arg abi "$TARGET_ABI" \
            --arg url "$SOURCEURL" \
            --arg checksum "$CHECKSUM" \
            --arg ts "$TIMESTAMP" \
            '{version:$version, changelog:$changelog, targetAbi:$abi, sourceUrl:$url, checksum:$checksum, timestamp:$ts}')

          # Drop any existing entry for this version, then prepend the fresh one.
          jq --arg version "$VERSION" --argjson entry "$ENTRY" \
            '.[0].versions |= ([$entry] + (map(select(.version != $version))))' \
            manifest.json > manifest.tmp && mv manifest.tmp manifest.json

      - name: Commit, tag and push
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CSPROJ" manifest.json
          git commit -m "Release ${VERSION}" || echo "Nothing to commit"
          git tag -f "$TAG"
          git push origin HEAD:"${{ github.ref_name }}"
          git push -f origin "$TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dist/${{ steps.package.outputs.zip }}
          body: |
            ${{ github.event.inputs.changelog }}

            **MD5 checksum:** `${{ steps.package.outputs.checksum }}`
