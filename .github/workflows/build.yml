name: Build

# Compile the plugin on every push and pull request so build breaks are
# caught before release.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.LanguageSelector.sln

      - name: Build (Release)
        run: dotnet build Jellyfin.Plugin.LanguageSelector.sln -c Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.Plugin.LanguageSelector.sln -c Release --no-build
